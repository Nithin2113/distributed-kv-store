services:
  leader:
    build: .
    container_name: orbit-leader
    environment:
      NODE_ID: node-1
      NODE_ROLE: leader
      NODE_PORT: 8000
      STORAGE_PATH: /data/store.json
      FOLLOWER_URLS: http://follower-1:8000,http://follower-2:8000
    ports:
      - "8000:8000"
    volumes:
      - leader-data:/data
    depends_on:
      follower-1:
        condition: service_healthy
      follower-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  follower-1:
    build: .
    container_name: orbit-follower-1
    environment:
      NODE_ID: node-2
      NODE_ROLE: follower
      NODE_PORT: 8000
      STORAGE_PATH: /data/store.json
      FOLLOWER_URLS: ""
    ports:
      - "8001:8000"
    volumes:
      - follower-1-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  follower-2:
    build: .
    container_name: orbit-follower-2
    environment:
      NODE_ID: node-3
      NODE_ROLE: follower
      NODE_PORT: 8000
      STORAGE_PATH: /data/store.json
      FOLLOWER_URLS: ""
    ports:
      - "8002:8000"
    volumes:
      - follower-2-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leader-data:
  follower-1-data:
  follower-2-data:
